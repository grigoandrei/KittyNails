# HTTP — serve ACME challenge for Certbot, redirect everything else to HTTPS
server {
    listen 80;
    server_name kittynailsberlin.de www.kittynailsberlin.de;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check for docker healthcheck
    location /health {
        access_log off;
        return 200 "ok";
    }

    # Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name kittynailsberlin.de www.kittynailsberlin.de;

    ssl_certificate /etc/letsencrypt/live/kittynailsberlin.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kittynailsberlin.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Redirect www to root
    if ($host = www.kittynailsberlin.de) {
        return 301 https://kittynailsberlin.de$request_uri;
    }

    # API — proxy to FastAPI
    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend — serve static files from the built React app
    location / {
        root /var/www/frontend;
        try_files $uri $uri/ /index.html;
    }
}
