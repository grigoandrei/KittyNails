name: Deploy to EC2

on:
  push:
    branches:
      - feature/ai-nail-classification
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0f508c584e8e25c73 \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["cd /home/ec2-user/kittynails && git pull origin ${{ github.ref_name }} && cd frontend && npm install --production=false && npm run build && cd .. && export DB_PASSWORD=$(grep ^DB_PASSWORD= .env.prod | cut -d= -f2) && docker compose -f docker-compose.prod.yml up -d app --build --force-recreate && docker compose -f docker-compose.prod.yml restart nginx reminder"]}' \
            --timeout-seconds 300 \
            --query "Command.CommandId" \
            --output text)
          
          echo "Command ID: $COMMAND_ID"
          
          # Wait for the command to complete
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0f508c584e8e25c73 || true
          
          # Get the output
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0f508c584e8e25c73 \
            --query "[Status,StandardOutputContent,StandardErrorContent]" \
            --output text
